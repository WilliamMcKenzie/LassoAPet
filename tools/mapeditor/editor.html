<title>Lasso Map Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a full-screen canvas with the map, a tool rail on the left, a palette tray along the
   bottom, and an inspector on the right; dark slate panels lit warm on top, cool below (QM's UI). */
:root {
  color-scheme: dark;
  --ink: #0e1218;
  --panel-top: #3a3640;
  --panel-bottom: #1b2230;
  --panel-edge: #0a0d13;
  --well: #121822;
  --text: #f4f1ea;
  --muted: #a3acbd;
  --accent: #ffcc4d;
  --accent-deep: #e0912b;
  --danger: #ff5a4e;
  --ok: #7fd36b;
  --display: "Montserrat", "Arial Black", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --outline: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 0 2px 0 #000;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--text); font: 600 13px/1.35 var(--display); overflow: hidden; user-select: none; -webkit-user-select: none; }
button, input, select { font: inherit; color: inherit; }
.panel { background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom)); border: 2px solid var(--panel-edge); border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); }
.title { font-weight: 800; text-shadow: var(--outline); letter-spacing: .02em; }
.label { font-weight: 800; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
#app { position: fixed; inset: 0; display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto 1fr auto; gap: 8px;
  padding: max(8px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
#app > * { pointer-events: auto; min-width: 0; }
#view { position: fixed; inset: 0; display: block; touch-action: none; }
#top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 8px; }
#top h1 { font-size: 17px; margin: 0 8px 0 4px; white-space: nowrap; }
#top h1 small { font-size: 11px; color: var(--accent); margin-left: 6px; }
#file { color: var(--muted); font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 2px solid var(--panel-edge); cursor: pointer;
  background: linear-gradient(180deg, #5a5560, #2b3242); font-weight: 800; text-shadow: var(--outline); white-space: nowrap; }
.btn:hover { filter: brightness(1.15); }
.btn:focus-visible, .tool:focus-visible, .sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.gold { background: linear-gradient(180deg, #ffd866, #d9822b 60%, #a8541f); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
#rail { grid-row: 2; display: flex; flex-direction: column; gap: 6px; padding: 6px; align-self: start; }
.tool { width: 42px; height: 42px; border-radius: 8px; border: 2px solid var(--panel-edge); background: linear-gradient(180deg, #4b4752, #232a38); cursor: pointer; display: grid; place-items: center; position: relative; }
.tool svg { width: 22px; height: 22px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 0 #000); }
.tool.on { background: linear-gradient(180deg, #ffd866, #d9822b 60%, #a8541f); }
.tool.on svg { stroke: #fff; }
.tool .k { position: absolute; right: 2px; bottom: 0; font-size: 9px; color: var(--muted); font-family: var(--mono); }
.tool.on .k { color: #3a1d06; }
.sizes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.size { height: 20px; border-radius: 5px; border: 2px solid var(--panel-edge); background: var(--well); cursor: pointer; font-size: 10px; font-family: var(--mono); padding: 0; }
.size.on { background: var(--accent-deep); color: #fff; }
#side { grid-row: 2; grid-column: 3; width: 250px; display: flex; flex-direction: column; gap: 8px; align-self: start; max-height: 100%; overflow: auto; }
#side section { padding: 10px; display: grid; gap: 8px; }
#side h2 { margin: 0; font-size: 14px; }
.row { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 6px; }
.row input, .row select { width: 100%; min-width: 0; background: var(--well); border: 1px solid #000; border-radius: 6px; padding: 5px 7px; font-family: var(--mono); font-size: 12px; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
.checks label { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
.note { color: var(--muted); font-size: 12px; font-weight: 600; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 800; background: var(--well); }
.pill.bad { background: var(--danger); color: #fff; text-shadow: var(--outline); }
.pill.good { background: #2d5a2a; color: var(--ok); }
#tray { grid-column: 1 / -1; grid-row: 3; padding: 6px 8px 8px; display: grid; gap: 6px; }
.tabs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tab { padding: 4px 10px; border-radius: 6px; border: 2px solid var(--panel-edge); background: var(--well); cursor: pointer; font-weight: 800; }
.tab.on { background: linear-gradient(180deg, #ffd866, #d9822b); text-shadow: var(--outline); }
#swatches { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: thin; }
.group { display: flex; flex-direction: column; gap: 4px; }
.group .label { padding-left: 2px; }
.group .items { display: flex; gap: 4px; }
.sw { width: 52px; border-radius: 7px; border: 2px solid var(--panel-edge); background: var(--well); cursor: pointer; padding: 3px 3px 2px; display: grid; justify-items: center; gap: 1px; }
.sw canvas, .sw img { width: 42px; height: 42px; image-rendering: pixelated; border-radius: 4px; object-fit: contain; }
.sw span { font-size: 9px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 48px; }
.sw.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-deep); }
.crow { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; cursor: pointer; }
.crow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow input[type=color] { width: 30px; height: 22px; padding: 0; border: 2px solid var(--panel-edge); border-radius: 5px; background: none; cursor: pointer; }
.mini { font-size: 10px; padding: 2px 6px; border-radius: 5px; border: 1px solid #000; background: var(--well); cursor: pointer; }
.cgroup { display: grid; gap: 3px; min-width: 190px; padding: 4px 6px; background: var(--well); border-radius: 7px; align-content: start; }
#cfilter { background: var(--well); border: 1px solid #000; border-radius: 6px; padding: 4px 8px; width: 160px; }
.scale { display: grid; grid-template-columns: 1fr 58px; gap: 6px; align-items: center; }
.scale input[type=range] { width: 100%; accent-color: var(--accent); }
#status { position: fixed; left: max(80px, calc(env(safe-area-inset-left, 0px) + 80px)); bottom: 150px; font-family: var(--mono); font-size: 12px; padding: 4px 8px; background: rgba(10,13,19,.8); border-radius: 6px; pointer-events: none; }
#toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; padding: 8px 12px; z-index: 5; max-width: calc(100% - 32px); }
#drop { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,13,19,.75); font-size: 24px; z-index: 6; pointer-events: none; }
@media (max-width: 720px) {
  #app { grid-template-columns: auto 1fr; }
  #side { grid-column: 1 / -1; grid-row: 4; width: auto; max-height: 30vh; }
  #status { bottom: auto; top: 110px; }
  #file { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<canvas id="view"></canvas>
<div id="app">
  <header id="top" class="panel">
    <h1 class="title">Lasso Map Editor<small>World 1</small></h1>
    <span id="file">world1.map</span>
    <span class="spacer"></span>
    <button class="btn" id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn" id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
    <button class="btn" id="open" title="Open a .map file (or drop one on the page)">Open .map</button>
    <button class="btn gold" id="save" title="Download the map to send over">Download .map</button>
    <input type="file" id="picker" accept=".map,.json,.txt,application/json,text/plain" hidden>
  </header>

  <nav id="rail" class="panel" aria-label="Tools">
    <button class="tool on" data-tool="paint" title="Paint tiles (B)"><svg viewBox="0 0 24 24"><path d="M4 20c3 0 5-2 5-4.5S7.5 12 6 13.5 4 17 4 20z"/><path d="M9 15l10-10 2 2-10 10"/></svg><span class="k">B</span></button>
    <button class="tool" data-tool="rect" title="Fill a rectangle (U)"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/></svg><span class="k">U</span></button>
    <button class="tool" data-tool="fill" title="Bucket: fill a patch of one tile (G)"><svg viewBox="0 0 24 24"><path d="M5 11l7-7 7 7-7 7z"/><path d="M19 15c0 2 1 3 1 4a1 1 0 0 1-2 0c0-1 1-2 1-4z"/></svg><span class="k">G</span></button>
    <button class="tool" data-tool="pick" title="Pick a tile from the map (I, or Alt+click)"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-9 9H5v-6z"/><path d="M12 6l6 6"/></svg><span class="k">I</span></button>
    <button class="tool" data-tool="select" title="Select and move objects and biome borders (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg><span class="k">V</span></button>
    <button class="tool" data-tool="place" title="Place the object chosen in the tray (P)"><svg viewBox="0 0 24 24"><path d="M12 21s-6-6-6-11a6 6 0 0 1 12 0c0 5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg><span class="k">P</span></button>
    <button class="tool" data-tool="pan" title="Pan (H, or drag with right or middle mouse, or hold Space)"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span class="k">H</span></button>
    <div class="label" style="text-align:center;margin-top:4px">Brush</div>
    <div class="sizes" id="sizes"></div>
  </nav>

  <aside id="side">
    <section class="panel" id="inspect"></section>
    <section class="panel">
      <h2 class="title">View</h2>
      <div class="checks" id="checks"></div>
      <div class="label">Go to</div>
      <div class="checks" id="goto"></div>
    </section>
  </aside>

  <footer id="tray" class="panel">
    <div class="tabs">
      <button class="tab on" data-tab="floor">Floor</button>
      <button class="tab" data-tab="walls">Walls</button>
      <button class="tab" data-tab="objects">Objects</button>
      <button class="tab" data-tab="colours">Colours</button>
      <input id="cfilter" type="search" placeholder="Filter colours" hidden>
      <span class="spacer"></span>
      <button class="btn" id="newtile" title="Add a tile: a copy of the one picked, a step higher">+ New tile</button>
    </div>
    <div id="swatches"></div>
  </footer>
</div>
<div id="status"></div>
<div id="toast" class="panel" hidden></div>
<div id="drop" class="title" hidden>Drop the .map to open it</div>

<script>
const BUNDLE = /*BUNDLE*/null;
// ---------------------------------------------------------------------------------------------
// Lasso Map Editor (QM, Nov 6): Fight to Steal an Egg's map editor for World 1's course
// (maps/world1.map). Each cell is one 4-stud square. Floors and walls are tiles; a wall tile
// has its own height, so walls of different heights mix along the course. Colours are the
// game's: each tile's name (Ground, Dirt, Wall, Cliff...) takes the colours of the biome it's
// in, as Shared/WorldColors paints them in Play; the Colours tab changes them per biome. The
// biome borders (World.Borders) are lines to drag. Objects are the course's obstacles, decor
// and nests, drawn from above.
// ---------------------------------------------------------------------------------------------
const PAL = BUNDLE.palette;
const STUD_ALPHA = 0.5;
const $ = (id) => document.getElementById(id);
const cv = $("view"), ctx = cv.getContext("2d");
const layer = document.createElement("canvas"), lctx = layer.getContext("2d");
const TILE_IDS = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!#$%&()*+-/:;<=>?@^_`{|}~ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõöøùúûüýþÿ";
const FINISH_FROM_END = 50;

// ---- state ------------------------------------------------------------------------------------
let M = null;          // the map: {head, borders, colours, tiles, objects, origin, cell, cols, rows}
let cells = null;      // Uint8Array: 0 nothing, k = tiles[k - 1]
let fileName = "world1.map";
let tool = "paint", brush = 2, current = 1, placing = null, selected = null;
let cam = { x: 0, z: -200, zoom: 1.2 };
const view = { studs: true, edges: true, shadeWalls: true, heights: true, objects: true, borders: true, labels: true, flip: false };
const undoStack = [], redoStack = [];
let dirty = true;

const css = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const ITEMS = {}; for (const it of BUNDLE.items) ITEMS[it.group + "/" + it.item] = it;

// ---- the .map file ----------------------------------------------------------------------------
function parseMap(text) {
  const d = JSON.parse(text);
  if (d.format !== "LassoAPet.map") throw new Error("That isn't a .map file from Lasso a Pet.");
  const [cols, rows] = d.size;
  if (!Array.isArray(d.rows) || d.rows.length !== rows) throw new Error("The map's rows don't match its size.");
  const idx = {};
  d.tiles.forEach((t, i) => (idx[t.id] = i + 1));
  const g = new Uint8Array(cols * rows);
  for (let r = 0; r < rows; r++) { const row = d.rows[r]; for (let c = 0; c < cols; c++) g[r * cols + c] = idx[row[c]] || 0; }
  const head = {};
  for (const k of Object.keys(d)) if (!["tiles", "objects", "rows", "colours", "borders"].includes(k)) head[k] = d[k];
  return { m: { head, borders: d.borders || {}, colours: d.colours || {}, tiles: d.tiles, objects: d.objects || [], origin: d.origin, cell: d.cell, cols, rows }, g };
}
function dumpMap() {
  const ids = M.tiles.map((t) => t.id);
  const rows = [];
  for (let r = 0; r < M.rows; r++) { let s = ""; for (let c = 0; c < M.cols; c++) { const k = cells[r * M.cols + c]; s += k ? ids[k - 1] : "."; } rows.push(s); }
  const head = Object.assign({}, M.head, { saved: new Date().toISOString().slice(0, 19) + "Z" });
  const out = [JSON.stringify(head).slice(0, -1) + ","];
  for (const k of ["borders", "colours"]) {
    out.push(`"${k}": {`);
    out.push(Object.keys(M[k]).sort().map((n) => `  "${n}": ${JSON.stringify(M[k][n])}`).join(",\n"));
    out.push("},");
  }
  for (const k of ["tiles", "objects"]) { out.push(`"${k}": [`); out.push(M[k].map((v) => "  " + JSON.stringify(v)).join(",\n")); out.push("],"); }
  out.push('"rows": [');
  out.push(rows.map((r) => JSON.stringify(r)).join(",\n"));
  out.push("]}");
  return out.join("\n") + "\n";
}
function load(text, name, quiet) {
  const { m, g } = parseMap(text);
  M = m; cells = g; fileName = name || "world1.map";
  $("file").textContent = fileName;
  undoStack.length = redoStack.length = 0;
  selected = null; current = Math.min(Math.max(current, 1), M.tiles.length);
  buildCellImages(); buildTray(); inspect(); updateUndo(); buildGoto();
  if (!quiet) toast(`Opened ${fileName}`);
  dirty = true;
}

// ---- geometry -----------------------------------------------------------------------------------
const X0 = () => M.origin[0], Z0 = () => M.origin[1];
function cellAt(x, z) {
  const c = Math.floor((x - X0()) / M.cell), r = Math.floor((z - Z0()) / M.cell);
  return c >= 0 && r >= 0 && c < M.cols && r < M.rows ? r * M.cols + c : -1;
}
const tileOf = (i) => (i >= 0 && cells[i] ? M.tiles[cells[i] - 1] : null);
function isChecker(c, r) {
  const ix = X0() / M.cell + c, iz = Z0() / M.cell + r;
  return ((((ix >> 1) + (iz >> 1)) % 2) + 2) % 2 === (view.flip ? 1 : 0); // (the game's checker squares are 8 studs: 2 cells)
}
function groundAt(x, z) { const t = tileOf(cellAt(x, z)); return t ? t.top : 0; }

// ---- biomes and their colours (as Shared/WorldColors) ---------------------------------------
const B = PAL.biomes;
function starts() {
  const s = [0];
  for (let i = 1; i < B.length; i++) s.push(M.borders[B[i].name] ?? B[i].start);
  return s;
}
function courseEnd() { return (M.borders.End ?? PAL.borders.End) - FINISH_FROM_END; }
function biomeAt(z) {
  const s = starts();
  for (let i = 0; i < B.length; i++) { const far = i + 1 < B.length ? s[i + 1] : -Infinity; if (z >= far) return i; }
  return B.length - 1;
}
function along(i, z) { const s = starts(), far = i + 1 < B.length ? s[i + 1] : courseEnd(); return Math.max(0, Math.min(1, (s[i] - z) / Math.max(1, s[i] - far))); }
function saturate(c) {
  const k = PAL.saturation || 1;
  if (!c || k === 1) return c;
  let [r, g, b] = c.map((v) => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), v = mx, d = mx - mn;
  let h = 0, s = mx ? d / mx : 0;
  if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  h /= 6; if (h < 0) h += 1; s = Math.min(1, s * k);
  const f = (n) => { const kk = (n + h * 6) % 6; return v - v * s * Math.max(0, Math.min(kk, 4 - kk, 1)); };
  return [f(5), f(3), f(1)].map((x) => Math.round(x * 255));
}
const lerp = (a, b, f) => a.map((v, i) => Math.round(v + (b[i] - v) * f));
// a name's colour in biome i at z: A (base) or B (checker); null when it has none there
function colourOf(i, z, name, which) {
  const bio = B[i], w = which === "A" ? 0 : 1;
  if (name === "Cap") return saturate(bio.cap) || colourOf(i, z, "Ground", "B");
  if (bio.depths) {
    const t = along(i, z), st = bio.depths;
    for (let k = 1; k < st.length; k++) if (t <= st[k].at) {
      const a = st[k - 1].keys[name], b = st[k].keys[name];
      if (a && b) return saturate(lerp(a[w], b[w], (t - st[k - 1].at) / Math.max(1e-6, st[k].at - st[k - 1].at)));
      break;
    }
    if (t > st[st.length - 1].at && st[st.length - 1].keys[name]) return saturate(st[st.length - 1].keys[name][w]);
  }
  const own = M.colours[bio.prefix + name + which];
  if (own) return saturate(own);
  const def = bio.keys[name];
  return def ? saturate(def[w]) : null;
}
// what a tile shows from above in row r: a floor its own name's colours, a wall its cap's
function tileColours(t, i, z) {
  if (t.wall) {
    const capName = t.cap || t.key;
    let a = colourOf(i, z, capName, "A");
    if (!a) a = colourOf(i, z, "Wall", "A");
    const b = capName === "Cap" ? a : (colourOf(i, z, capName, "B") || colourOf(i, z, "Wall", "B") || a);
    return [a, b];
  }
  const a = colourOf(i, z, t.key, "A");
  if (!a) return [[150, 150, 150], [140, 140, 140]]; // (no colours for that name here: it keeps its own in the game)
  return [a, colourOf(i, z, t.key, "B") || a];
}
function sideColours(t, i, z) {
  const a = colourOf(i, z, t.key, "A") || colourOf(i, z, "Wall", "A");
  return [a, colourOf(i, z, t.key, "B") || colourOf(i, z, "Wall", "B") || a];
}
const NAMES = (() => { const s = new Set(["Ground", "Wall", "Cap"]); for (const b of B) for (const k of Object.keys(b.keys)) s.add(k); return [...s].sort(); })();

// ---- cell pictures: one pixel a cell ---------------------------------------------------------------
let cellCv, cellImg;
function buildCellImages() {
  cellCv = document.createElement("canvas"); cellCv.width = M.cols; cellCv.height = M.rows;
  cellImg = cellCv.getContext("2d").createImageData(M.cols, M.rows);
  paintCells(0, 0, M.cols - 1, M.rows - 1);
}
function paintCells(c0, r0, c1, r1) {
  c0 = Math.max(0, c0); r0 = Math.max(0, r0); c1 = Math.min(M.cols - 1, c1); r1 = Math.min(M.rows - 1, r1);
  const d = cellImg.data;
  for (let r = r0; r <= r1; r++) {
    const z = Z0() + (r + 0.5) * M.cell, i = biomeAt(z), cache = [];
    for (let c = c0; c <= c1; c++) {
      const n = r * M.cols + c, k = cells[n], p = n * 4;
      if (!k) { d[p + 3] = 0; continue; }
      const cols = cache[k] || (cache[k] = tileColours(M.tiles[k - 1], i, z));
      const col = cols[isChecker(c, r) ? 1 : 0];
      d[p] = col[0]; d[p + 1] = col[1]; d[p + 2] = col[2]; d[p + 3] = 255;
    }
  }
  cellCv.getContext("2d").putImageData(cellImg, 0, 0);
  dirty = true;
}
const studTile = (() => {

  if (k.startsWith("arrow") && selected && !selected.border) { e.preventDefault(); const d = e.shiftKey ? 4 : 1; return nudgeSelected((o) => { if (k === "arrowleft") o.x -= d; if (k === "arrowright") o.x += d; if (k === "arrowup") o.z -= d; if (k === "arrowdown") o.z += d; }); }
});
window.addEventListener("keyup", (e) => { if (e.key === " ") { space = false; setTool(tool); } });
function tileLabel(t) { return t.wall ? `${t.key} wall · cap ${t.cap || t.key} · height ${t.top}` : `${t.key} · top ${t.top}`; }
function status(w) {
  const i = cellAt(w.x, w.z), t = tileOf(i);
  const what = i < 0 ? "off the map" : t ? tileLabel(t) : "nothing";
  $("status").textContent = `x ${Math.round(w.x)}  z ${Math.round(w.z)}  ·  ${B[biomeAt(w.z)].name}  ·  ${what}`;
}

// ---- panels ----------------------------------------------------------------------------------------
document.querySelectorAll(".tool").forEach((b) => b.addEventListener("click", () => setTool(b.dataset.tool)));
function buildSizes() {
  const box = $("sizes"); box.innerHTML = "";
  [1, 2, 4, 8].forEach((n, i) => {
    const b = document.createElement("button"); b.className = "size" + (n === brush ? " on" : ""); b.textContent = n * 4 + "";
    b.title = `${n}×${n} cells (${n * 4} studs) · key ${i + 1}`; b.onclick = () => { brush = n; buildSizes(); setTool("paint"); };
    box.appendChild(b);
  });
}
let tab = "floor";
function showTab() { document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x.dataset.tab === tab)); buildTray(); }
document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.tab; showTab(); }));
// a tile's swatch, in the colours of the biome the camera is over
function tileSwatch(t) {
  const s = document.createElement("canvas"); s.width = s.height = 32;
  const g = s.getContext("2d");
  if (!t) { g.fillStyle = "#0a0d13"; g.fillRect(0, 0, 32, 32); g.strokeStyle = "#ff5a4e"; g.lineWidth = 3; g.beginPath(); g.moveTo(6, 6); g.lineTo(26, 26); g.stroke(); return s; }
  // (in the colours of the biome the camera is over, or the first biome that has its name)
  let z = Math.min(-1, cam.z), i = biomeAt(z);
  const name = t.wall ? t.cap || t.key : t.key;
  if (name !== "Cap" && !colourOf(i, z, name, "A")) { const j = B.findIndex((b) => b.keys[name]); if (j >= 0) { i = j; z = starts()[j] - 1; } }
  const [a, b] = tileColours(t, i, z);
  for (let x = 0; x < 2; x++) for (let y = 0; y < 2; y++) { g.fillStyle = css((x + y) % 2 ? b : a); g.fillRect(x * 16, y * 16, 16, 16); }
  g.globalCompositeOperation = "source-atop"; for (let x = 0; x < 4; x++) for (let y = 0; y < 4; y++) g.drawImage(studTile, x * 8, y * 8, 8, 8);
  if (t.wall) {
    g.globalCompositeOperation = "source-over";
    const [sa] = sideColours(t, i, z), h = Math.max(4, Math.min(22, t.top / 4));
    g.fillStyle = css(sa); g.fillRect(0, 32 - h, 32, h); g.fillStyle = "rgba(0,0,0,.35)"; g.fillRect(0, 32 - h, 32, 2);
  }
  return s;
}
function buildTray() {
  const box = $("swatches"); box.innerHTML = "";
  $("newtile").hidden = !(tab === "floor" || tab === "walls"); $("cfilter").hidden = tab !== "colours";
  if (!M) return;
  if (tab === "colours") return buildColours(box);
  const groups = [];
  if (tab === "floor" || tab === "walls") {
    const list = M.tiles.map((t, i) => [t, i + 1]).filter(([t]) => !!t.wall === (tab === "walls"));
    list.sort((a, b) => (a[0].key + a[0].cap).localeCompare(b[0].key + b[0].cap) || a[0].top - b[0].top);
    groups.push(["Erase", [[null, 0]]]);
    const by = {};
    for (const e of list) (by[tab === "walls" ? `${e[0].key} / ${e[0].cap || e[0].key}` : e[0].key] ||= []).push(e);
    for (const [name, l] of Object.entries(by)) groups.push([name, l]);
    for (const [name, l] of groups) {
      const g = document.createElement("div"); g.className = "group";
      g.innerHTML = `<div class="label">${name}</div><div class="items"></div>`;
      for (const [t, k] of l) {
        const b = document.createElement("button"); b.className = "sw" + (k === current ? " on" : "");
        b.title = t ? tileLabel(t) : "Nothing: no floor and no wall";
        b.appendChild(tileSwatch(t));
        const s = document.createElement("span"); s.textContent = t ? (t.wall ? `${t.top}` : `${t.top >= 0 ? "+" : ""}${t.top}`) : "None"; b.appendChild(s);
        b.onclick = () => { current = k; buildTray(); inspect(); if (!["paint", "rect", "fill"].includes(tool)) setTool("paint"); };
        g.querySelector(".items").appendChild(b);
      }
      box.appendChild(g);
    }
    return;
  }
  const sets = {};
  for (const it of BUNDLE.items) (sets[it.group] ||= []).push(it);
  for (const [name, list] of Object.entries(sets)) {
    const g = document.createElement("div"); g.className = "group";
    g.innerHTML = `<div class="label">${name}</div><div class="items"></div>`;
    for (const it of list.sort((a, b) => a.item.localeCompare(b.item))) {
      const b = document.createElement("button"); b.className = "sw obj" + (placing && placing.group === it.group && placing.item === it.item ? " on" : "");
      b.title = `Place: ${it.item}`;
      const c = document.createElement("canvas"); c.width = c.height = 64;
      const x = c.getContext("2d"); let r = 3; for (const [px, pz, sx, sz] of it.parts) r = Math.max(r, Math.hypot(px, pz) + Math.max(sx, sz) / 2);
      x.translate(32, 32); x.scale(28 / r, 28 / r); drawObject(x, { group: it.group, item: it.item, x: 0, z: 0, yaw: 0, scale: 1 });
      b.appendChild(c);
      const s = document.createElement("span"); s.textContent = it.item.replace(/([a-z])([A-Z])/g, "$1 $2"); b.appendChild(s);
      b.onclick = () => { setTool("place"); placing = it; selected = null; buildTray(); inspect(); };
      g.querySelector(".items").appendChild(b);
    }
    box.appendChild(g);
  }
}
$("cfilter").oninput = buildTray;

// ---- colours: each biome's, as World's colour attributes (Shared/WorldColors) ----------------------
const hex = (c) => "#" + c.map((v) => v.toString(16).padStart(2, "0")).join("");
const unhex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
let colourBefore = null;
function colourRow(bio, name, which) {
  const attr = bio.prefix + name + which, def = bio.keys[name][which === "A" ? 0 : 1];
  const row = document.createElement("label"); row.className = "crow";
  row.innerHTML = `<input type="color" value="${hex(M.colours[attr] || def)}"><span>${name} ${which === "A" ? "" : "checker"}</span>`;
  const input = row.querySelector("input");
  const reset = document.createElement("button"); reset.className = "mini"; reset.textContent = "Reset"; reset.title = "Back to Config's colour";
  reset.hidden = !(attr in M.colours);
  input.oninput = () => { if (colourBefore === null) colourBefore = JSON.stringify(M.colours); M.colours[attr] = unhex(input.value); paintCells(0, 0, M.cols - 1, M.rows - 1); };
  input.onchange = () => {
    const before = colourBefore ?? JSON.stringify(M.colours); colourBefore = null;
    M.colours[attr] = unhex(input.value);
    if (JSON.stringify(M.colours[attr]) === JSON.stringify(def)) delete M.colours[attr];
    const after = JSON.stringify(M.colours);
    if (after !== before) { push({ kind: "colours", before, after }); paintCells(0, 0, M.cols - 1, M.rows - 1); changed(); }
    reset.hidden = !(attr in M.colours);
  };
  reset.onclick = (e) => { e.preventDefault(); const before = JSON.stringify(M.colours); delete M.colours[attr]; push({ kind: "colours", before, after: JSON.stringify(M.colours) }); paintCells(0, 0, M.cols - 1, M.rows - 1); changed(); buildTray(); };
  row.appendChild(reset);
  return row;
}
function buildColours(box) {
  const f = $("cfilter").value.trim().toLowerCase();
  for (const bio of B) {
    const names = Object.keys(bio.keys).filter((n) => !f || (bio.name + " " + n).toLowerCase().includes(f)).sort();
    if (!names.length) continue;
    const g = document.createElement("div"); g.className = "cgroup";
    g.innerHTML = `<div class="label">${bio.name}${bio.depths ? " (deep water shades by depth)" : ""}</div>`;
    for (const n of names) { g.appendChild(colourRow(bio, n, "A")); g.appendChild(colourRow(bio, n, "B")); }
    box.appendChild(g);
  }
}

function field(label, value, onchange, opts) {
  const row = document.createElement("label"); row.className = "row";
  row.innerHTML = `<span class="label">${label}</span>`;
  let el;
  if (opts) { el = document.createElement("select"); el.innerHTML = opts.map((o) => `<option${o == value ? " selected" : ""}>${o}</option>`).join(""); }
  else { el = document.createElement("input"); el.type = typeof value === "number" || value === "" ? "number" : "text"; el.step = "any"; el.value = value; }
  el.onchange = () => onchange(el.type === "number" ? (el.value === "" ? null : +el.value) : el.value);
  row.appendChild(el);
  return row;
}
function note(box, text) { const n = document.createElement("div"); n.className = "note"; n.textContent = text; box.appendChild(n); }
function inspect() {
  const box = $("inspect"); box.innerHTML = "";
  if (!M) return;
  const h = document.createElement("h2"); h.className = "title"; box.appendChild(h);
  if (selected && selected.border) {
    const name = selected.border;
    h.textContent = name === "End" ? "Finish line" : `${name} border`;
    box.appendChild(field("Z", borderZ(name), (v) => edit("borders", () => (M.borders[name] = clampBorder(name, v)), () => paintCells(0, 0, M.cols - 1, M.rows - 1))));
    note(box, name === "End" ? "Where the course ends: the finish line. The floor stops here in the game." : `Where the ${name} starts. Drag it along the course: the biomes either side stretch and shrink, their colours, herds and nests with them.`);
    return;
  }
  if (selected) {
    const o = selected;
    h.textContent = o.item.replace(/([a-z])([A-Z])/g, "$1 $2");
    const set = (k) => (v) => nudgeSelected((x) => { if (v === null) delete x[k]; else x[k] = v; });
    box.appendChild(field("X", o.x, set("x")));
    box.appendChild(field("Z", o.z, set("z")));
    box.appendChild(field("Raise", o.y || 0, set("y")));
    box.appendChild(field("Yaw", o.yaw || 0, set("yaw")));
    box.appendChild(field("Scale", o.scale || 1, set("scale")));
    const actions = document.createElement("div"); actions.className = "tabs";
    actions.innerHTML = `<button class="btn" id="dup">Duplicate</button><button class="btn" id="del">Delete</button>`;
    box.appendChild(actions);
    $("dup").onclick = duplicateSelected; $("del").onclick = deleteSelected;
    note(box, `${o.group}${o.id ? "" : " · new"}. Raise is studs above the floor under it. Drag to move (Alt: off the 1-stud grid). Q / E turn 15° (Shift 90°), [ ] scale, arrows nudge.${o.group === "Obstacles" ? " (The game sizes obstacles itself: Config.ObstacleScale.)" : ""}`);
    return;
  }
  if (tool === "place" && placing) { h.textContent = "Placing: " + placing.item; note(box, "Click the map to place one."); return; }
  const t = current ? M.tiles[current - 1] : null;
  if (!t) { h.textContent = "Nothing"; note(box, "Paints cells away: no floor and no wall."); return; }
  h.textContent = t.wall ? `${t.key} wall, height ${t.top}` : `${t.key} floor`;
  let count = 0; for (let i = 0; i < cells.length; i++) if (cells[i] === current) count++;
  note(box, `${count} cells (${count * 16} studs²)`);
  const editTile = (k) => (v) => editTiles(() => { const tt = M.tiles[current - 1]; if (v === null || v === false || v === "") delete tt[k]; else tt[k] = v; });
  box.appendChild(field("Wall", t.wall ? "yes" : "no", (v) => editTiles(() => { const tt = M.tiles[current - 1]; if (v === "yes") { tt.wall = true; tt.cap = tt.cap || "Cap"; tt.key = tt.key === "Ground" ? "Wall" : tt.key; tt.top = Math.max(tt.top, 12); } else { delete tt.wall; delete tt.cap; } }), ["no", "yes"]));
  box.appendChild(field(t.wall ? "Sides" : "Colour", t.key, editTile("key"), NAMES));
  if (t.wall) box.appendChild(field("Cap", t.cap || t.key, editTile("cap"), NAMES));
  box.appendChild(field(t.wall ? "Height" : "Top", t.top, (v) => editTile("top")(v ?? 0)));
  box.appendChild(field("Glow", t.material === "Neon" ? "yes" : "no", (v) => editTile("material")(v === "yes" ? "Neon" : null), ["no", "yes"]));
  if (!t.wall) box.appendChild(field("Solid", t.nocollide ? "no" : "yes", (v) => editTile("nocollide")(v === "no"), ["yes", "no"]));
  note(box, t.wall
    ? "A wall rises from below the floor to Height, its top studs the cap. For walls of other heights, + New tile adds one a step higher: paint or bucket-fill with it. Changing Height here moves every cell of this tile."
    : "Top is the floor's height in studs. Colour picks the name whose colours it takes in each biome (Colours tab).");
}
$("newtile").onclick = () => {
  const wall = tab === "walls";
  const base = (current && !!M.tiles[current - 1].wall === wall) ? M.tiles[current - 1] : M.tiles.find((t) => !!t.wall === wall) || { key: wall ? "Wall" : "Ground", cap: "Cap", top: wall ? 20 : 0, wall: wall || undefined };
  const used = new Set(M.tiles.map((t) => t.id));
  const id = [...TILE_IDS].find((c) => !used.has(c));
  if (!id) return toast("That's every tile the format has room for.");
  const t = JSON.parse(JSON.stringify(base)); t.id = id; t.top = base.top + (wall ? 4 : 1);
  editTiles(() => M.tiles.push(t));
  current = M.tiles.length; buildTray(); inspect();
  toast(wall ? "Added a wall 4 studs higher: set its height on the right, then paint or bucket-fill with it." : "Added a floor tile a stud higher.");
};

const checkDefs = [["studs", "Studs"], ["edges", "Height edges"], ["shadeWalls", "Shade walls"], ["heights", "Wall heights"], ["objects", "Objects"], ["borders", "Borders"], ["labels", "Labels"], ["flip", "Flip checker"]];
for (const [k, label] of checkDefs) {
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox"${view[k] ? " checked" : ""}> ${label}`;
  l.querySelector("input").onchange = (e) => { view[k] = e.target.checked; if (k === "flip") paintCells(0, 0, M.cols - 1, M.rows - 1); dirty = true; };
  $("checks").appendChild(l);
}
function buildGoto() {
  const box = $("goto"); box.innerHTML = "";
  const s = starts();
  B.forEach((b, i) => {
    const btn = document.createElement("button"); btn.className = "mini"; btn.textContent = b.name;
    btn.onclick = () => { cam.z = starts()[i] - H / 2 / cam.zoom + 40; cam.x = 0; dirty = true; buildTray(); };
    box.appendChild(btn);

// ---- files -------------------------------------------------------------------------------------------
let toastTimer;
function toast(msg, actions) {
  const t = $("toast"); t.innerHTML = ""; const s = document.createElement("span"); s.textContent = msg; t.appendChild(s);
  for (const [label, f] of actions || []) { const b = document.createElement("button"); b.className = "btn"; b.textContent = label; b.onclick = () => { t.hidden = true; f(); }; t.appendChild(b); }
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), actions ? 9000 : 4200);
}
const DRAFT = "lasso-map-editor-draft";
let draftTimer;
function changed() {
  dirty = true;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => { try { localStorage.setItem(DRAFT, JSON.stringify({ name: fileName, text: dumpMap(), at: Date.now() })); } catch (e) { /* (a draft is a convenience) */ } }, 800);
}
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
let mapVersion = "";
async function download() {
  if (!M) return;
  const text = dumpMap();
  if (LOCAL) {
    toast("Saving into the game...");
    try {
      const r = await fetch("/save", { method: "POST", body: text, headers: { "X-Map-Base": mapVersion } });
      const msg = await r.text();
      if (r.ok) {
        mapVersion = r.headers.get("X-Map-Version") || mapVersion;
        BUNDLE.map = text;
        try { localStorage.removeItem(DRAFT); } catch (e) { /* */ }
        if (r.headers.get("X-Map-Merged") === "1") {
          const m = await fetch("/world.map", { cache: "no-store" });
          if (m.ok) { mapVersion = m.headers.get("X-Map-Version") || mapVersion; BUNDLE.map = await m.text(); const keep = { ...cam }; load(BUNDLE.map, "world1.map", true); cam = keep; }
        }
      }
      toast(msg);
      return;
    } catch (e) { toast("Couldn't reach the local server, downloading instead."); }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = fileName.endsWith(".map") ? fileName : "world1.map";
  document.body.appendChild(a); a.click(); a.remove();
  toast(`Saved ${a.download}.`);
}
$("save").onclick = download;
$("undo").onclick = undo; $("redo").onclick = redo;
$("open").onclick = () => $("picker").click();
function openFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { try { load(String(r.result), file.name.replace(/\.json$/, "")); } catch (e) { toast(e.message || "Couldn't read that file."); } };
  r.readAsText(file);
}
$("picker").onchange = (e) => { openFile(e.target.files[0]); e.target.value = ""; };
window.addEventListener("dragover", (e) => { e.preventDefault(); $("drop").hidden = false; });
window.addEventListener("dragleave", (e) => { if (!e.relatedTarget) $("drop").hidden = true; });
window.addEventListener("drop", (e) => { e.preventDefault(); $("drop").hidden = true; openFile(e.dataTransfer.files[0]); });

// ---- start -------------------------------------------------------------------------------------------
window.addEventListener("resize", resize);
resize(); buildSizes();
load(BUNDLE.map, "world1.map", true);
if (LOCAL) { $("save").textContent = "Save to game"; $("save").title = "Save into maps/world1.map and build it in Studio"; }
async function start() {
  if (LOCAL) {
    try { const r = await fetch("/world.map", { cache: "no-store" }); if (r.ok) { mapVersion = r.headers.get("X-Map-Version") || ""; BUNDLE.map = await r.text(); load(BUNDLE.map, "world1.map", true); } } catch (e) { /* the baked-in copy */ }
  }
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT) || "null");
    const shape = (t) => { try { const j = JSON.parse(t); return JSON.stringify([j.origin, j.size]); } catch (e) { return ""; } };
    if (d && d.text && d.text !== BUNDLE.map && shape(d.text) === shape(BUNDLE.map)) {
      const original = BUNDLE.map;
      load(d.text, d.name, true);
      toast(`Picked up your unsaved edits from ${new Date(d.at).toLocaleString()}.`, [["Start from the game's map", () => { load(original, "world1.map", true); try { localStorage.removeItem(DRAFT); } catch (e) { /* */ } }]]);
    }
  } catch (e) { /* no draft */ }
}
start();
// open on the Meadow, the course filling the width
cam = { x: 0, z: -260, zoom: Math.max(0.6, Math.min(3, (W - 380) / 340)) };
(function frame() { if (dirty && W > 0) { try { draw(); } catch (e) { console.error(e); } } requestAnimationFrame(frame); })();
</script>
